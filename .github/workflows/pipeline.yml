# Le pipeline CI/CD : le « tapis roulant » de la démo.
# À chaque push sur main : 1) on teste (JUnit)  2) si TOUT est vert, on construit le site et on le met en production.
name: Pipeline CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  tests:
    name: 1 · Tests automatiques (JUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Lancer les tests
        run: mvn -B test

  deploiement:
    name: 2 · Mise en production
    needs: tests            # ← le déploiement n'a lieu QUE si les tests passent
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compiler
        run: mvn -B compile
      - name: Générer le site avec Java
        run: java -cp target/classes fr.univeiffel.boulangerie.GenerateurSite site
      - name: Préparer le site
        uses: actions/configure-pages@v5
      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Déployer en production
        id: deploy
        uses: actions/deploy-pages@v4
